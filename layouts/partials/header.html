<header id="banner">
  <h2>
    <a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>

    {{ partial "nav" . }}
  </h2>
  <i>{{ .Site.Params.description }}</i>
  <nav>
    <ul>
      {{ range .Site.Menus.main.ByWeight -}}
      <li>
        {{ .Pre }}<a href="{{ .URL }}" title="{{ .Title }}">{{- .Name -}}</a>{{ .Post }}
      </li>
      {{- end }}
    </ul>
  </nav>
</header>
